# Copy this file to /opt/fjodor/config.properties and fill it in.
# NEVER commit config.properties or share it: the bot token gives control over your Discord app.
# Every setting can also be given as an environment variable, e.g. DISCORD_BOT_TOKEN.

# Keep 127.0.0.1: only nginx on the same machine talks to the site.
web.bind=127.0.0.1
# Must differ from the order bot (8780), Pearl'It All (8790) and the Python app already on 8800.
web.port=8810

# The two addresses nginx sends here. Anything that isn't the drop address gets the main page.
site.host=fjodor-types.com
drop.host=drop.fjodor-types.com

# The repo checkout: index.html, monologues.js and drop/index.html are read from here on every request,
# so a git pull changes the texts without a restart.
site.dir=/opt/fjodor/src
# Every submission (pending, approved, rejected) is kept here.
data.file=/opt/fjodor/submissions.json

# The review bot. Fill in all three to turn it on, then set
# https://drop.fjodor-types.com/discord/interactions as the Interactions Endpoint URL (General Information).
# Token: Bot -> Reset Token. Public key: General Information -> Public Key.
# Channel: right-click the review channel -> Copy Channel ID (Developer Mode on).
#discord.bot-token=PASTE_TOKEN_HERE
#discord.public-key=PASTE_PUBLIC_KEY_HERE
#discord.review-channel-id=000000000000000000

# Who may press Approve / Edit / Reject: your Discord user ID (right-click your name -> Copy User ID).
# Several people: separate with commas. Leave it empty and anyone who can see the channel can review.
discord.reviewer-ids=000000000000000000
