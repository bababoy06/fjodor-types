<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Someone is typing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
<style>
/* VOICE: intimate, unhurried, a little uncanny — someone across the table at 3 a.m.
   IDEA: a typewriter left running in a dark room, addressing whoever sits down, quoting old books from memory.
   PICTURE: the words themselves, rising out of the dark, older lines dissolving upward.
   COLOUR and TYPE: one night palette in both themes — charcoal ground, warm grey ink; Courier Prime, italic for the dead authors.
   LAYOUT: a single column, lowered below centre, nothing else on screen. */
:root{color-scheme:dark;--bg:#111112;--ink:#cfccc6;--quote:#e9e4d8;--dim:#7d7a75}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:clamp(17px,4.4vw,22px)/1.6 "Courier Prime","Courier New",monospace;overflow:hidden;cursor:default;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,rgba(255,250,240,.045),transparent 60%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6))}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 max(6vw,20px) 34vh;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 38%);mask-image:linear-gradient(to bottom,transparent 0,#000 38%)}
#out{width:100%;max-width:36ch;transition:opacity 2.4s ease}
#out.gone{opacity:0}
p{margin:0 0 1.1em;transition:color 1.6s ease,opacity 1.6s ease;white-space:pre-wrap;overflow-wrap:anywhere}
p.q{font-style:italic;color:var(--quote);padding-left:1.4ch}
p.old{color:var(--dim)}
p.older{opacity:.45}
p.cite{font-size:.72em;color:var(--dim);opacity:0;transition:opacity 2.5s ease;padding-left:1.4ch}
p.cite.show{opacity:1}
#cur{display:inline-block;width:.6em;height:1.05em;margin-left:1px;vertical-align:-.15em;background:var(--ink);animation:blink 1.05s steps(1) infinite}
#cur.typing{animation:none}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#cur{animation:none;opacity:.8}#out,p,p.cite{transition:none}}
noscript{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim)}
</style>
</head>
<body>
<div id="stage" aria-live="polite"><div id="out"></div></div>
<noscript>It needs JavaScript to speak.</noscript>
<script src="monologues.js"></script>
<script>
{
const out=document.getElementById('out');
const cur=document.createElement('span');cur.id='cur';cur.setAttribute('aria-hidden','true');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const visits=store.get('voice.visits',0)+1;store.set('voice.visits',visits);
const lastVisit=store.get('voice.last',0);store.set('voice.last',Date.now());
const touch=matchMedia('(pointer:coarse)').matches;
const hour=()=>new Date().getHours();
const part=()=>{const h=hour();return h<5?'night':h<12?'morning':h<18?'afternoon':h<22?'evening':'night'};
const clock=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const weekday=()=>new Date().toLocaleDateString('en-GB',{weekday:'long'});
const visitline=()=>visits===1?"This is the first time we've met.":visits===2?"You came back. I hoped you would.":`This is visit number ${visits}. I'm keeping count. Someone should.`;
const device=()=>touch?"You're holding me in one hand. Your thumb is already thinking about leaving.":"Your cursor is resting somewhere. Close to the little x in the corner.";
const fill=s=>s.replace(/\{(\w+)\}/g,(m,k)=>({part,clock,weekday,visitline,device}[k]||(()=>m))());

const M=(window.MONOLOGUES||[]).map(m=>({...m,when:m.hours?h=>{const[f,t]=m.hours;return f<t?h>=f&&h<t:h>=f||h<t}:null}));
if(!M.length){out.textContent='(monologues.js is missing)';throw new Error('no monologues')}

/* ---- typing engine ---- */
let p=null,t=null,running=false;const pending=[];
function newP(cls){
  const ps=out.querySelectorAll('p');
  ps.forEach((x,i)=>{x.classList.add('old');if(i<ps.length-2)x.classList.add('older')});
  p=document.createElement('p');if(cls)p.className=cls;t=document.createTextNode('');p.append(t,cur);out.appendChild(p);
}
const delay=c=>{let d=28+Math.random()*50;if('.!?'.includes(c))d+=420;else if(',;:'.includes(c))d+=170;else if(c==='—')d+=220;if(Math.random()<.03)d+=260;return d};
async function typeLine(line){
  const quote=line.startsWith('> ');
  newP(quote?'q':'');
  if(quote)line=line.slice(2);
  cur.classList.add('typing');
  for(const part of fill(line).split(/(\[(?:p|del):\d+\])/)){
    const m=part.match(/^\[(p|del):(\d+)\]$/);
    if(m){
      if(m[1]==='p'){cur.classList.remove('typing');await sleep(+m[2]);cur.classList.add('typing')}
      else for(let i=0;i<+m[2];i++){t.data=t.data.slice(0,-1);await sleep(55+Math.random()*30)}
      continue;
    }
    for(const c of part){t.data+=c;await sleep(delay(c)*(quote?1.25:1))}
  }
  cur.classList.remove('typing');
  await sleep(650+Math.random()*350);
}
async function erase(){cur.classList.add('typing');while(t.data.length){t.data=t.data.slice(0,-1);await sleep(70)}cur.classList.remove('typing')}
async function clear(){out.classList.add('gone');await sleep(2500);out.replaceChildren();out.classList.remove('gone');p=null;newP()}
async function flush(){const lines=pending.shift();pending.length=0;for(const l of lines)await typeLine(l)}
async function run(script){
  const lines=script.split('\n').map(l=>l.trim()).filter(Boolean);
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(line==='~'){
      await sleep(1600+Math.random()*800);
      if(pending.length&&lines.slice(i+1).filter(l=>l!=='~').length>2){await flush();await sleep(1400)}
      continue;
    }
    if(line==='---'){await clear();continue}
    await typeLine(line);
  }
  pending.length=0;
}
function showCite(text){
  const c=document.createElement('p');c.className='cite';c.textContent='— '+text;
  out.insertBefore(c,p);
  requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('show')));
}

/* ---- you can't answer, but it notices when you try ---- */
let tried=false,leftAt=0,missed=false,taps=[];
const tried_=()=>{if(running&&!tried){tried=true;pending.push(["A moment ago you tried to say something.","I know. You can't. That's the arrangement.","[p:600]It's all right. I heard it anyway."])}};
addEventListener('keydown',e=>{if(!e.metaKey&&!e.ctrlKey&&!e.altKey)tried_()});
addEventListener('pointerdown',()=>{const n=Date.now();taps=taps.filter(x=>n-x<2500);taps.push(n);if(taps.length>=3)tried_()});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){leftAt=Date.now();return}
  if(running&&!missed&&!pending.length&&Date.now()-leftAt>4000){missed=true;pending.push(["You went away for a moment, just now.","I kept talking. I don't know how much you missed.","[p:600]It doesn't matter. Some of it was for the room."])}
});

/* ---- choose something not heard before ---- */
const rand=n=>{try{return crypto.getRandomValues(new Uint32Array(1))[0]%n}catch(e){return Math.floor(Math.random()*n)}};
function pick(){
  const h=hour();
  const pool=M.filter(m=>!m.when||m.when(h));
  let seen=store.get('voice.seen',[]);
  let fresh=pool.filter(m=>!seen.includes(m.id));
  if(!fresh.length){seen=seen.slice(-1);fresh=pool.filter(m=>!seen.includes(m.id))}
  const m=fresh[rand(fresh.length)];
  store.set('voice.seen',[...seen,m.id]);
  return m;
}
function greeting(){
  if(visits===1)return 'Hello.';
  const gap=Date.now()-lastVisit;
  if(gap<10*60e3)return 'Back already?';
  if(gap>7*864e5)return "Hello. It's been a while.";
  return 'Hello again.';
}

(async()=>{
  newP();
  await sleep(2600+Math.random()*1200);
  running=true;
  await typeLine(greeting());
  await sleep(1300);
  await erase();
  await sleep(1100);
  out.replaceChildren();p=null;
  const m=pick();
  await run(m.text);
  running=false;
  if(m.cite){await sleep(1200);showCite(m.cite)}
  await sleep(m.cite?7000:4200);
  await clear();
  await sleep(1200);
  await typeLine('Come back later.');
  await typeLine("I'll have something else to say.");
})();
}
</script>
</body>
</html>
